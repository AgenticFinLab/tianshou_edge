# Overnight occupation run: federated SAC on HalfCheetah-v5, launched by the
# watchdog after the benchmark chain finishes. 4 clients packed on one card
# (num_gpus=0.25 x 4 = 1.0) via CUDA_VISIBLE_DEVICES=0,1 set by the watchdog.
algorithm: sac
env: hopper
seeds: [42]
device: cuda
clients_count: 6
envs_per_client: 1
buffer_size: 200000
warmup_steps: 2000
aggregation: fedavg
agg_scope: all
fedprox_mu: 0.0
heterogeneity:
  gravity: 9.8
algorithm_config:
  hidden_sizes: [256, 256]
  lr: 0.001
  tau: 0.005
  alpha: 0.2
budget:
  rounds: 300
  collect_per_update: 1
  updates_per_round: 1000
  batch_size: 256
evaluation:
  every_rounds: 25
  episodes: 10
ray:
  num_cpus: 8
  num_gpus: 0.25
output:
  csv_path: results/overnight_hopper.csv
